<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Galeri Cucur Sundariyah - Website UMKM</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#konten">Lewati ke konten utama</a>
    <header class="site-header">
      <nav class="nav" aria-label="Navigasi utama">
        <a class="brand" href="index.html">
          <img
            src="assets/images/logo-umkm.jpeg"
            alt=""
            width="32"
            height="32"
          />
          Cucur Sundariyah
        </a>
        <ul>
          <li><a href="index.html">Beranda</a></li>
          <li><a href="tentang.html">Tentang Kami</a></li>
          <li><a href="produk.html">Produk</a></li>
          <li><a aria-current="page" href="galeri.html">Galeri</a></li>
        </ul>
      </nav>
    </header>
    <main id="konten" class="page">
      <h1>Galeri Cucur Sundariyah</h1>

      <section aria-labelledby="media-title">
        <h2 id="media-title">Media Usaha</h2>
        <div class="galeri-list">
          <figure class="galeri-item">
            <img
              src="assets/images/cucur.jpeg"
              alt="Cucur dengan taburan gula aren di atas daun pisang"
            />
            <figcaption>
              Cucur &mdash; camilan klasik gula aren, Rp2.000
            </figcaption>
          </figure>
          <figure class="galeri-item">
            <img
              src="assets/images/klepon.jpeg"
              alt="Klepon hijau dengan isian gula merah cair"
            />
            <figcaption>
              Klepon &mdash; sensasi gula meleleh di mulut, Rp3.000
            </figcaption>
          </figure>
          <figure class="galeri-item">
            <img
              src="assets/images/onde-onde.jpeg"
              alt="Onde onde bertabur wijen berbentuk bulat"
            />
            <figcaption>
              Onde onde &mdash; bulat sempurna dan padat berisi, Rp2.000
            </figcaption>
          </figure>
          <figure class="galeri-item">
            <img
              src="assets/images/wajik.jpeg"
              alt="Wajik ketan berbentuk belah ketupat di atas daun pisang"
            />
            <figcaption>
              Wajik &mdash; ketan manis gula merah beraroma pandan, Rp2.500
            </figcaption>
          </figure>
          <figure class="galeri-item">
            <img
              src="assets/images/proses-goreng.jpeg"
              alt="Wajan berisi adonan cucur yang sedang digoreng"
            />
            <figcaption>
              Proses menggoreng cucur secara tradisional di dapur kami.
            </figcaption>
          </figure>
        </div>
      </section>

      <section aria-labelledby="audio-title">
        <h2 id="audio-title">Nada Penanda Kedai</h2>
        <p id="audio-note">
          Nada notifikasi singkat sebagai penanda kedai saat pesanan diterima.
        </p>
        <audio
          controls
          aria-describedby="audio-note"
          src="assets/audio/notifikasi-toko.mp3"
        >
          Browser Anda tidak mendukung pemutar audio.
        </audio>
      </section>
    </main>
    <footer class="site-footer">
      <p>&copy; 2026 Cucur Sundariyah. Data pada halaman ini bersifat dummy.</p>
    </footer>
